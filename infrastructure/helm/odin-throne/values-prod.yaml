# --------------------------------------------------------------------------
# Odin's Throne — Production Overrides
#
# Usage: helm upgrade --install odin-throne ./infrastructure/helm/odin-throne \
#          -f ./infrastructure/helm/odin-throne/values-prod.yaml \
#          --set app.image.tag=$IMAGE_TAG
# --------------------------------------------------------------------------

namespace: odins-throne

# Deploy prerequisites (see issue #21):
#   1. Reserve the global static IP `odins-throne-hall-ip` first — the ingress
#      annotation `kubernetes.io/ingress.global-static-ip-name` (values.yaml)
#      references it by name and the load balancer will not provision without it:
#        gcloud compute addresses create odins-throne-hall-ip \
#          --global --project=fenrir-ledger-prod
#   2. After deploy, point DNS at the reserved IP with scripts/dns.sh
#      (Namecheap API, idempotent). The ManagedCertificate reaches ACTIVE
#      once the A record resolves.

app:
  replicaCount: 2

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
      ephemeral-storage: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
      ephemeral-storage: "256Mi"

ingress:
  enabled: true
  hosts:
    - odins-throne.shanaghy.com

oauth2Proxy:
  enabled: true
  redirectUrl: "https://odins-throne.shanaghy.com/oauth2/callback"

rbac:
  enabled: true
